# ─────────────────────────────────────────────────────────────────────────
# THE CALENDAR + THE LECTURES ARE SEPARATE, so you can reorder lectures freely.
#
#   timeline:  the fixed sequence of calendar dates. Two kinds of entry:
#      • a plain date  (e.g. `- 2026-08-17`)  = a LECTURE SLOT: it shows the
#        next lecture from the `schedule:` list below, in order.
#      • a mapping  (e.g. `- { date: 2026-09-07, topic: "LABOR DAY, NO CLASS" }`)
#        = a PINNED row tied to that date: holidays, bootcamps, exams, reviews,
#        office-hour days, and the two non-class-day project-due markers. Pinned
#        rows show their own content and do NOT consume a lecture.
#        Mapping fields: date, date_label (for ranges/"TBD"), dow, n, topic,
#        chapters, readings.
#
#   schedule:  the LECTURES, in teaching order, with NO dates. To rearrange the
#      course, just reorder these — each one drops onto the next lecture slot in
#      the timeline, so the dates take care of themselves. (Keep the number of
#      lectures == the number of plain-date slots in the timeline.)
#
# Project/exam labels are still auto-matched by date, so "P0 Due" lands on the
# 8/28 pinned row, "Midterm Exam" on the 10/19 pinned row, etc.
# ─────────────────────────────────────────────────────────────────────────

timeline:
  - 2026-08-17
  - 2026-08-19
  - 2026-08-24
  - { n: "--", date_label: "8/24 - 25", dow: "--", topic: "Bootcamp 1 [(Slides)](./lectures/bootcamp_1.pdf)" }
  - 2026-08-26
