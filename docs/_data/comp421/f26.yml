# ─────────────────────────────────────────────────────────────────────────
# COMP 421 — Fall 2026  ·  SINGLE SOURCE OF TRUTH
#
# Edit dates HERE and they update everywhere (schedule table, projects page,
# and each project spec page). Dates are ISO format: YYYY-MM-DD.
# Leave a date blank (e.g. `final:`) to have pages render "TBD".
#
# Pages read these via Liquid, e.g.
#   {{ site.data.comp421.f26.projects.p0.due | date: "%-m/%-d/%y" }}   ->  8/28/26
#
# HOW THE SCHEDULE PLACES MILESTONES: sched.markdown does NOT hardcode
# "P1 Released" / "P1 Due" / "Midterm Exam" on rows. For every row it matches
# the row's date against these project release/due dates and exam dates and
# fills the label in automatically. So to move a milestone, just change its date.
#
# To roll forward a year: copy this file to f27.yml and point the f27
# pages at site.data.comp421.f27 (see comp421-semester-rollover notes).
# ─────────────────────────────────────────────────────────────────────────

